name: CI

# Every compile and test runs here, on GitHub's runners, never on a developer's machine.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Full checkout: the package's nsh.json points at the crate under crates/, outside packages/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # nsh.json names the crate, so nsh check and nsh test drive cargo; pin the toolchain like the rust job's.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      # The pinned installer URLs install whichever NSH_VERSION names; only the POSIX step runs on ubuntu.
      - name: Install NSH
        if: runner.os != 'Windows'
        env:
          NSH_VERSION: v0.4.0
        run: |
          curl -fsSL https://raw.githubusercontent.com/SuperNSH/nsh-builds/master/install.sh | sh
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Windows variant of the verbatim install pair; inert on ubuntu, kept for a Windows runner.
      - name: Install NSH
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NSH_VERSION: v0.4.0
        run: |
          irm https://raw.githubusercontent.com/SuperNSH/nsh-builds/master/install.ps1 | iex
          "$env:LOCALAPPDATA\nsh\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      # No nsh build: this repo ships no demo app; check and test are the package's gates.
      - name: Check and test
        working-directory: packages/nsh-device-info
        run: |
          nsh check
          nsh test

  cross-check:
    name: check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-ios }
          - { os: macos-latest, target: aarch64-apple-ios-sim }
          - { os: ubuntu-latest, target: aarch64-linux-android }
          - { os: ubuntu-latest, target: wasm32-unknown-unknown }
          # windows.rs is cfg'd to Windows and the rust job runs on ubuntu, so only this entry compiles it.
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      # Full checkout: clippy runs from the workspace manifest at the repo root, not from the package.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The toolchain pin installs each matrix entry's target alongside clippy.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6cddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
          targets: ${{ matrix.target }}
      # Clippy only: none of the pinned dependencies compiles C, so the Android target needs no NDK CC block.
      - run: cargo clippy -p nsh-device-info --target ${{ matrix.target }} --all-targets -- -D warnings
      # Host runs execute the cfg-gated bridge tests (apple.rs, windows.rs) that clippy only compiles;
      # the cross targets' binaries cannot run, so the ubuntu entries stop at clippy.
      - name: Test the host's bridges
        if: runner.os == 'macOS' || runner.os == 'Windows'
        run: cargo test -p nsh-device-info --all-targets
